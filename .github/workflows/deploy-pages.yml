# Deploy docs to GitHub Pages (mirror)

# Primary production deploy is Cloudflare Pages — see deploy-cloudflare.yml
# and https://code-reference-docs.pages.dev

name: Deploy docs to GitHub Pages (mirror)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          STATIC_EXPORT: 'true'
          BASE_PATH: /docs
          NEXT_PUBLIC_BASE_PATH: /docs
          NEXT_PUBLIC_SITE_URL: https://masterofowls.github.io/docs
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
